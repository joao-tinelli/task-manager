apiVersion: v1
kind: ConfigMap
metadata:
  name: taskmanager-config
  labels:
    app.kubernetes.io/name: taskmanager
    app.kubernetes.io/part-of: taskmanager-app
data:
  DB_HOST: "postgres"
  DB_PORT: "5432"
  DB_NAME: "taskmanager"
  SERVER_PORT: "8080"
  CORS_ALLOWED_ORIGINS: "http://localhost:5173,http://localhost:30080,http://127.0.0.1:30080"
  SHUTDOWN_TIMEOUT: "30s"
